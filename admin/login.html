<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#062a44">
    <title>Admin Sign In — Ardson Maritime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css?v=1ccf599adf">
    <style>
        body { background: var(--sea-950); }
        .auth-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .auth-wrap::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(60% 50% at 20% 20%, rgba(27, 134, 196, 0.22), transparent 70%),
                radial-gradient(50% 40% at 85% 80%, rgba(18, 104, 160, 0.18), transparent 70%);
            pointer-events: none;
        }
        .auth-card {
            position: relative;
            width: min(420px, 100%);
            background: #fff;
            border-radius: var(--r-xl);
            box-shadow: 0 30px 70px -30px rgba(4, 29, 48, 0.6);
            padding: 2.75rem 2.5rem;
        }
        .auth-card__brand { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1.75rem; }
        .auth-card__brand .brand__mark { background: var(--sea-800); }
        .auth-card h1 {
            font-family: var(--serif);
            font-size: 2rem;
            line-height: 1.1;
            color: var(--sea-950);
            margin: 0 0 0.4rem;
            letter-spacing: -0.02em;
        }
        .auth-card p { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 1.75rem; }
        .auth-card .btn { margin-top: 1.25rem; }
        .auth-meta {
            position: absolute;
            bottom: 1.5rem;
            left: 0; right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            letter-spacing: 0.04em;
        }
        .auth-meta a { color: rgba(255, 255, 255, 0.8); text-decoration: underline; text-underline-offset: 2px; }
        .auth-alt {
            margin: 1rem 0 0;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .auth-alt a { color: var(--sea-700); text-decoration: none; }
        .auth-alt a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-card__brand">
                <span class="brand__mark" aria-hidden="true">A</span>
                <span class="brand__text">
                    <span class="brand__name">Ardson Maritime</span>
                    <span class="brand__sub">Admin Console</span>
                </span>
            </div>

            <h1>Sign in</h1>
            <p>Access the vacancy, candidate, and crewing management console.</p>

            <form id="admin-login-form" novalidate>
                <div class="form-grid">
                    <div class="field">
                        <label for="admin-user">Email or username</label>
                        <input id="admin-user" name="user" type="text" required autocomplete="username" placeholder="admin@ardsonmaritime.com">
                    </div>
                    <div class="field">
                        <label for="admin-pass">Password</label>
                        <input id="admin-pass" name="password" type="password" required autocomplete="current-password" placeholder="••••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn--primary btn--block" id="admin-login-btn">Sign in</button>
            </form>

            <p class="auth-alt" id="admin-existing-session" hidden>
                Already signed in. <a href="index.html">Continue to the admin console</a>.
            </p>
            <p class="auth-alt"><a href="../index.html">&larr; Back to website</a></p>
        </div>

        <p class="auth-meta">&copy; <span data-year>2026</span> Ardson Maritime Career Center · Internal system</p>
    </div>

    <div id="toast-container" class="toast-container" role="region" aria-live="polite" aria-label="Notifications"></div>

    <script>
        window.ARDSON_ADMIN_CONFIG = { apiBase: '/api/v1/admin', home: 'index.html' };
        // Never bounce away from the sign-in form automatically: a stale token
        // used to send visitors straight back to the console (or the public home
        // page when the admin index was missing). Offer a link instead.
        if (sessionStorage.getItem('ardson_admin_token')) {
            var note = document.getElementById('admin-existing-session');
            if (note) note.hidden = false;
        }
    </script>
    <script src="../js/admin.js?v=1ccf599adf" defer></script>
</body>
</html>
